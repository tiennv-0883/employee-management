spring.application.name=employee-management

# Thông tin kết nối database lấy từ biến môi trường, không hard-code vào file
# DB_URL và DB_USERNAME có giá trị mặc định cho máy local, DB_PASSWORD bắt buộc phải set
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Mặc định Spring Boot ẩn thông báo lỗi trong response; bật lên để client thấy
# lỗi validate cụ thể của từng field
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

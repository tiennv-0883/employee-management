spring.application.name=employee-management

# Profile mac dinh khi chay ma khong chi dinh gi (vi du bam Run trong IDE).
# Cac cau hinh rieng cua tung moi truong nam o application-dev.yml / application-prod.yml
spring.profiles.default=dev

# Cache bao cao nhan vien: het han 1 phut ke tu luc ghi
spring.cache.cache-names=employeeReport,employeeCount
spring.cache.caffeine.spec=expireAfterWrite=60s
